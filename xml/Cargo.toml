[package]
name = "dicom-xml"
version = "0.10.0"
authors = ["Stephan Vedder <stephan.vedder@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Enet4/dicom-rs"
description = "DICOM data serialization to/from XML"
keywords = ["dicom", "attributes", "xml", "serialization"]
readme = "README.md"

[dependencies]
base64 = "0.22"
dicom-core = { path = "../core", version = "0.10" }
dicom-dictionary-std = { path = "../dictionary-std", version = "0.10" }
dicom-object = { path = "../object", version = "0.10" }
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1.0.164", features = ["derive"] }
tracing = "0.1.34"

[dev-dependencies]
dicom-test-files = "0.4"
pretty_assertions = "1.3.0"
